[log]
directives = "info,ort=debug,sqlx=warn"
# Append plain-text diagnostics without ANSI colors, including after service restarts.
file = "logs/docparse.log"

[server]
max_uploads = 100
host = "127.0.0.1"
port = 8080
api_prefix = "/api/v1/docparse"

[database]
url = "postgresql://postgres:testpassword@127.0.0.1:5432/docparse"
timeout_ms = 5000
acquire_timeout_ms = 5000
idle_timeout_ms = 600000
max_connections = 20
min_connections = 5
sqlx_logging_level = "debug"
sqlx_slow_statements_logging_level = "warn"
sqlx_slow_statements_threshold_ms = 1000

[runtime]
# Shared by every ONNX session: level1, level2, level3, or all.
optimization_level = "level1"
# Applied to every model; disable cached memory plans for variable shapes.
memory_pattern = false
continue_on_error = true

[render]
workers = 5
queue_size = 16
dpi = 144
max_long_edge_pixels = 2400

[layout]
model_path = "models/pp-doclayout-v3/inference.onnx"
model_config_path = "models/pp-doclayout-v3/inference.yml"
model_manifest_path = "models/pp-doclayout-v3/model-manifest.json"
score_threshold = 0.5
session_size = 2
batch_size = 1
queue_size = 8

[tsr]
mode = "tsr_only"
session_size = 2
batch_size = 1
queue_size = 16
timeout_ms = 60000
model = "slanet_plus"
model_path = "models/slanet-plus/inference.onnx"
model_config_path = "models/slanet-plus/inference.yml"
model_manifest_path = "models/slanet-plus/model-manifest.json"

[tsr.cell_detection]
enabled = true
session_size = 2
batch_size = 4
queue_size = 16
model = "wireless"
score_threshold = 0.3
model_path = "models/rtdetr-table-cell-wireless/inference.onnx"
model_config_path = "models/rtdetr-table-cell-wireless/inference.yml"
model_manifest_path = "models/rtdetr-table-cell-wireless/model-manifest.json"

[ocr]
policy = "disabled"

[ocr.detection]
session_size = 2
batch_size = 4
queue_size = 16
model_path = "models/pp-ocrv6-medium-det/inference.onnx"
model_config_path = "models/pp-ocrv6-medium-det/inference.yml"
model_manifest_path = "models/pp-ocrv6-medium-det/model-manifest.json"

[ocr.recognition]
session_size = 2
batch_size = 4
queue_size = 16
model_path = "models/pp-ocrv6-medium-rec/inference.onnx"
model_config_path = "models/pp-ocrv6-medium-rec/inference.yml"
model_manifest_path = "models/pp-ocrv6-medium-rec/model-manifest.json"

[ocr.orientation]
queue_size = 8
session_size = 2
batch_size = 4
model_path = "models/pp-lcnet-textline-ori/inference.onnx"
model_config_path = "models/pp-lcnet-textline-ori/inference.yml"
model_manifest_path = "models/pp-lcnet-textline-ori/model-manifest.json"

[formula]
queue_size = 32
batch_size = 4
inline_enabled = true
display_enabled = true
timeout_ms = 120000

[formula.engine]
type = "texo"
session_size = 4
encoder_path = "models/texo/encoder_model.onnx"
decoder_path = "models/texo/decoder_model_merged.onnx"
tokenizer_path = "models/texo/tokenizer.json"

[fusion]
minimum_line_coverage = 0.30
center_minimum_line_coverage = 0.10
assignment_coverage_weight = 0.55
assignment_center_weight = 0.20
assignment_baseline_weight = 0.10
assignment_confidence_weight = 0.10
assignment_specificity_weight = 0.05
paragraph_gap_multiplier = 1.5
indent_tolerance_points = 6.0
font_size_tolerance_points = 0.5
estimated_font_size_tolerance_points = 1.5

[output]
formula_placeholder = "[formula]"
include_evidence = false
include_diagnostics = true

[monitoring]
# Optional history upstream; live metrics and /metrics do not require Prometheus.
# prometheus_url = "http://127.0.0.1:19090"
