[package]
name = "docparse-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Independent PaddleOCR ONNX detection, orientation and recognition"

[features]
default = []
coreml = ["docparse-layout/coreml"]
cuda = ["docparse-layout/cuda"]
metal = ["docparse-layout/metal"]
openvino = ["docparse-layout/openvino"]
wasm = ["docparse-config/wasm", "docparse-layout/wasm"]

[dependencies]
# workspace crates
docparse-common.workspace = true
docparse-config.workspace = true
docparse-layout.workspace = true

# error
thiserror.workspace = true

# async
futures-util.workspace = true
tokio.workspace = true

# config and serialization
serde.workspace = true
serde_yml.workspace = true

# builder
typed-builder.workspace = true

# inference and image
geo.workspace = true
image.workspace = true
ndarray.workspace = true
ort.workspace = true

# cli and diagnostics
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# async
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# browser
ort-web.workspace = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
# testing
tempfile.workspace = true

[lints]
workspace = true
