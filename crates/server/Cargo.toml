[package]
name = "docparse-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Durable native PDF parsing jobs over HTTP and SSE"

[features]
default = []
# A server backend always enables the same provider for layout, OCR, and TSR.
coreml = ["docparse-core/layout-coreml", "docparse-core/ocr-coreml", "docparse-core/tsr-coreml"]
cuda = ["docparse-core/layout-cuda", "docparse-core/ocr-cuda", "docparse-core/tsr-cuda"]
metal = ["docparse-core/layout-metal", "docparse-core/ocr-metal", "docparse-core/tsr-metal"]
openvino = ["docparse-core/layout-openvino", "docparse-core/ocr-openvino", "docparse-core/tsr-openvino"]

[dependencies]
# workspace crates
docparse-config.workspace = true
docparse-core.workspace = true
docparse-database.workspace = true

# error
snafu.workspace = true

# async
futures-util.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt-multi-thread", "signal", "time"] }
tokio-util.workspace = true

# http
axum.workspace = true
tower-http.workspace = true

# api documentation
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-scalar.workspace = true

# storage
tempfile.workspace = true

# identity
uuid.workspace = true

# config and serialization
serde.workspace = true
serde_json.workspace = true

# builder
typed-builder.workspace = true

# hashing
blake3.workspace = true

# cli and diagnostics
clap = { workspace = true, features = ["env"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# workspace crates
docparse-layout.workspace = true
docparse-migration.workspace = true

# testing
tower.workspace = true

[lints]
workspace = true
