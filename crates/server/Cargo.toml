[package]
name = "docparse-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Durable native PDF parsing jobs over HTTP and SSE"

[features]
default = []
# Forward the unified parser provider without model-specific overrides.
coreml = ["docparse-core/coreml"]
cuda = ["docparse-core/cuda"]
metal = ["docparse-core/metal"]
openvino = ["docparse-core/openvino"]

[dependencies]
# workspace crates
docparse-common.workspace = true
docparse-config.workspace = true
docparse-core = { workspace = true, features = ["pdfium-ipc"] }
docparse-database.workspace = true
docparse-layout.workspace = true

# error
snafu.workspace = true

# async
futures-util.workspace = true
ipc-channel.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util.workspace = true

# http
axum.workspace = true
http-body.workspace = true
# reqwest 0.13 gates query serialization separately from JSON and renamed the Rustls feature.
reqwest = { workspace = true, features = ["query", "rustls"] }
tower-http.workspace = true

# api documentation
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-scalar.workspace = true

# storage
tempfile.workspace = true

# identity
uuid.workspace = true

# config and serialization
base64.workspace = true
chrono.workspace = true
figment.workspace = true
serde.workspace = true
serde_json.workspace = true

# builder
typed-builder.workspace = true

# hashing
blake3.workspace = true

# cli and diagnostics
clap = { workspace = true, features = ["env"] }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
prometheus-parse.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# workspace crates
docparse-ocr.workspace = true
docparse-tsr.workspace = true

# inference and image
image.workspace = true

# testing
flate2.workspace = true
tower.workspace = true

[lints]
workspace = true
