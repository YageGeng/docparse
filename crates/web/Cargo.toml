[package]
name = "docparse-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser Worker bindings for DocParse"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# workspace crates
docparse-config = { workspace = true, features = ["wasm"] }
docparse-core = { workspace = true, features = ["wasm"] }
docparse-layout = { workspace = true, features = ["wasm"] }

# config and serialization
serde.workspace = true

# inference and image
ort = { workspace = true, features = ["api-17", "alternative-backend"] }

# cli and diagnostics
tracing.workspace = true

# browser
js-sys.workspace = true
ort-web.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[lints]
workspace = true
