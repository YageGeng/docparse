[package]
name = "docparse-formula-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Bounded formula recognition through image-only or prompted HTTP services"

[features]
default = []
wasm = ["docparse-config/wasm", "docparse-formula/wasm", "docparse-layout/wasm"]

[dependencies]
# workspace crates
docparse-common.workspace = true
docparse-config.workspace = true
docparse-formula.workspace = true
docparse-layout.workspace = true

# error
thiserror.workspace = true

# async
futures-util.workspace = true
tokio.workspace = true

# http
reqwest = { workspace = true, features = ["multipart"] }

# config and serialization
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

# builder
typed-builder.workspace = true

# inference and image
image.workspace = true

# cli and diagnostics
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# http
# reqwest 0.13 renamed the explicit Rustls feature.
reqwest = { workspace = true, features = ["rustls"] }

[dev-dependencies]
# async
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }

# http
axum.workspace = true

[lints]
workspace = true
