[package]
name = "docparse-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Command-line interface for docparse"

[features]
default = []
layout-coreml = ["docparse-core/layout-coreml"]
layout-cuda = ["docparse-core/layout-cuda"]
layout-openvino = ["docparse-core/layout-openvino"]

[[bin]]
name = "docparse"
path = "src/main.rs"

[dependencies]
# workspace crates
docparse-config.workspace = true
docparse-core.workspace = true
docparse-layout.workspace = true

# error
anyhow.workspace = true

# async
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

# config and serialization
serde_json.workspace = true

# builder
typed-builder.workspace = true

# cli and diagnostics
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# testing
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
