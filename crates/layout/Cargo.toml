[package]
name = "docparse-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Layout detection interfaces and PP-DocLayoutV3 inference for docparse"

[features]
wasm = ["docparse-config/wasm"]
default = []
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
openvino = ["ort/openvino"]

[dependencies]
# workspace crates
docparse-config.workspace = true

# error
thiserror.workspace = true

# async
tokio.workspace = true

# config and serialization
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true

# builder
typed-builder.workspace = true

# inference and image
geo.workspace = true
image.workspace = true
ndarray.workspace = true
ort.workspace = true
sha2.workspace = true

# cli and diagnostics
tracing.workspace = true
web-time.workspace = true

[dev-dependencies]
# error
anyhow.workspace = true

# cli and diagnostics
clap.workspace = true

# testing
tempfile.workspace = true

[lints]
workspace = true

# async
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

# inference and image
ort = { workspace = true, features = ["api-28", "copy-dylibs", "download-binaries", "tls-rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# inference and image
# Keep browser acceleration local to the WASM dependency graph.
ort = { workspace = true, features = ["api-17", "alternative-backend", "webgpu"] }

# browser
ort-web.workspace = true
wasm-bindgen-futures.workspace = true
