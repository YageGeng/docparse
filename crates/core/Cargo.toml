[package]
name = "docparse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Native PDF extraction and layout-text fusion for docparse"

[features]
wasm = ["docparse-config/wasm", "docparse-layout/wasm", "pdfium/wasm"]
default = []
layout-coreml = ["docparse-layout/coreml"]
layout-cuda = ["docparse-layout/cuda"]
layout-openvino = ["docparse-layout/openvino"]

[dependencies]
# workspace crates
docparse-config.workspace = true
docparse-layout.workspace = true
pdfium.workspace = true

# error
thiserror.workspace = true

# async
tokio.workspace = true

# config and serialization
serde.workspace = true
serde_json.workspace = true

# builder
typed-builder.workspace = true

# inference and image
image.workspace = true

# cli and diagnostics
tracing.workspace = true

[dev-dependencies]
# config and serialization
figment.workspace = true

# inference and image
sha2.workspace = true

# testing
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# async
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# async
futures-util.workspace = true

# browser
wasm-bindgen-futures.workspace = true
