[package]
name = "docparse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Native PDF extraction and layout-text fusion for docparse"

[features]
default = []
wasm = ["docparse-config/wasm", "docparse-layout/wasm", "docparse-ocr/wasm", "docparse-tsr/wasm", "pdfium/wasm"]
ocr-coreml = ["docparse-ocr/coreml"]
ocr-cuda = ["docparse-ocr/cuda"]
ocr-metal = ["docparse-ocr/metal"]
ocr-openvino = ["docparse-ocr/openvino"]
layout-metal = ["docparse-layout/metal"]
tsr-coreml = ["docparse-tsr/coreml"]
tsr-cuda = ["docparse-tsr/cuda"]
tsr-metal = ["docparse-tsr/metal"]
tsr-openvino = ["docparse-tsr/openvino"]
layout-coreml = ["docparse-layout/coreml"]
layout-cuda = ["docparse-layout/cuda"]
layout-openvino = ["docparse-layout/openvino"]

[dependencies]
# workspace crates
docparse-config.workspace = true
docparse-layout.workspace = true
docparse-ocr.workspace = true
docparse-tsr.workspace = true
pdfium.workspace = true

# error
thiserror.workspace = true

# async
tokio.workspace = true

# api documentation
utoipa.workspace = true

# config and serialization
serde.workspace = true
serde_json.workspace = true

# builder
typed-builder.workspace = true

# inference and image
image.workspace = true

# cli and diagnostics
tracing.workspace = true
web-time.workspace = true

[dev-dependencies]
# config and serialization
figment.workspace = true

# inference and image
sha2.workspace = true


# cli and diagnostics
tracing-subscriber.workspace = true

# testing
flate2.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# async
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

# config and serialization
rmp.workspace = true

# hashing
blake3.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# async
futures-util.workspace = true

# browser
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
