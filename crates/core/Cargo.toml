[package]
name = "docparse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Native PDF extraction and layout-text fusion for docparse"

[features]
default = []
# Select one provider for every native inference model in this parser.
coreml = ["docparse-formula/coreml", "docparse-formula-texo/coreml", "docparse-layout/coreml", "docparse-ocr/coreml", "docparse-tsr/coreml"]
cuda = ["docparse-formula/cuda", "docparse-formula-texo/cuda", "docparse-layout/cuda", "docparse-ocr/cuda", "docparse-tsr/cuda"]
metal = ["docparse-formula/metal", "docparse-formula-texo/metal", "docparse-layout/metal", "docparse-ocr/metal", "docparse-tsr/metal"]
openvino = ["docparse-formula/openvino", "docparse-formula-texo/openvino", "docparse-layout/openvino", "docparse-ocr/openvino", "docparse-tsr/openvino"]
pdfium-ipc = ["dep:ipc-channel", "dep:tracing-subscriber"]
wasm = ["docparse-config/wasm", "docparse-formula/wasm", "docparse-formula-mineru/wasm", "docparse-formula-texo/wasm", "docparse-layout/wasm", "docparse-ocr/wasm", "docparse-tsr/wasm", "pdfium/wasm"]

[dependencies]
# workspace crates
docparse-config.workspace = true
docparse-formula.workspace = true
docparse-formula-mineru.workspace = true
docparse-formula-texo.workspace = true
docparse-layout.workspace = true
docparse-ocr.workspace = true
docparse-tsr.workspace = true
pdfium.workspace = true

# error
thiserror.workspace = true

# async
futures-util.workspace = true
tokio.workspace = true

# api documentation
utoipa.workspace = true

# config and serialization
serde.workspace = true
serde_json.workspace = true

# builder
typed-builder.workspace = true

# inference and image
image.workspace = true

# cli and diagnostics
tracing.workspace = true
web-time.workspace = true

[dev-dependencies]
# config and serialization
figment.workspace = true

# inference and image
sha2.workspace = true


# cli and diagnostics
tracing-subscriber.workspace = true

# testing
flate2.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# async
ipc-channel = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

# config and serialization
rmp.workspace = true

# hashing
blake3.workspace = true

# cli and diagnostics
tracing-subscriber = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# browser
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[[test]]
name = "pdfium_ipc"
required-features = ["pdfium-ipc"]

[[bin]]
name = "docparse-pdfium-worker"
path = "src/bin/pdfium_worker.rs"
required-features = ["pdfium-ipc"]
