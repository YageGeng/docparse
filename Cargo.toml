[workspace]
members = [
  "crates/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/YageGeng/docparse.git"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_import_braces = "deny"
elided_lifetimes_in_paths = "deny"

[workspace.lints.clippy]
# Panic prevention
string_slice = "warn"
indexing_slicing = "warn"

unwrap_used = "warn"
panic = "warn"
get_unwrap = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

# Silent failure prevention
let_underscore_future = "warn"
let_underscore_must_use = "allow"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Async/concurrency safety
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"

# Numeric safety
float_cmp = "warn"
float_cmp_const = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

# Unsafe code safety
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
mem_forget = "warn"

[workspace.dependencies]
# workspace crates
docparse-config = { version = "0.1.0", path = "crates/config" }
docparse-core = { version = "0.1.0", path = "crates/core" }
docparse-layout = { version = "0.1.0", path = "crates/layout" }
pdfium = { package = "docparse-pdfium", version = "1.9.0", path = "crates/pdfium" }
pdfium-sys = { package = "docparse-pdfium-sys", version = "1.9.0", path = "crates/pdfium-sys" }

# error
anyhow = "1"
thiserror = "2"

# async
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# config and serialization
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
# Exact float parsing keeps canonical page coordinates byte-stable after JSON round trips.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
serde_yml = "0.0.13"

# builder
typed-builder = "0.23"

# inference and image
geo = "0.33.1"
image = { version = "0.25", default-features = false, features = ["png"] }
ndarray = "0.17"
# Rustls makes build-time ONNX Runtime downloads portable without system TLS dependencies.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["api-28", "copy-dylibs", "download-binaries", "ndarray", "std", "tls-rustls", "tracing"] }
sha2 = "0.11"

# cli and diagnostics
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter"] }

# build
bindgen = "0.72"
flate2 = "1"
tar = "0.4"
ureq = "3"

# runtime loading
libloading = "0.9"

# testing
assert_cmd = "2"
blake3 = "1"
predicates = "3"
proptest = "1"
tempfile = "3"
